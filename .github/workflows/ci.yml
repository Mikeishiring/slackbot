name: CI

# Least privilege: this workflow only reads the tree.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor: earlier runners discover no .ts test files
        # at all (they exit 0 having run nothing) and don't accept glob
        # arguments. Run the supported range so a version-specific break in
        # the test runner or the SDK shows up here, not on a contributor's
        # machine.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN in .git/config where a postinstall
          # script from any transitive dependency could read it.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
